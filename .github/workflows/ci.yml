name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: Lint / Typecheck / Test / Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm -r lint

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test
        run: pnpm -r test

      - name: Build Web Dashboard & Embed Assets
        run: |
          pnpm --filter @vault-insights/web-dashboard-template build
          node scripts/embed-dashboard-assets.mjs

      - name: Build
        run: pnpm -r build

  mobile-compat:
    name: Mobile Compatibility Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: "Mobile compat: Ban Node built-ins & raw fetch in obsidian-plugin"
        run: |
          # AGENTS.md §0.5 — モバイル互換性の静的チェック
          # .eslintrc.cjs の no-restricted-imports / no-restricted-globals ルールで
          # Node組み込みモジュール (fs, path, child_process等) と
          # グローバル fetch の直接使用を検出・拒否する
          cd packages/obsidian-plugin
          pnpm eslint src/ --ext .ts --rule '{"no-restricted-imports": "error", "no-restricted-globals": "error"}'
